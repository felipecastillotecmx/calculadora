name: Calidad y seguridad
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: calculadora-${{ github.ref }}
  cancel-in-progress: false
env:
  SONAR_HOST_URL: https://sonarqube.lynvera.ai
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
jobs:
  revision:
    name: Revisión del código
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: ruff check .
    - run: ruff format --check .
  unitarias:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: pytest pruebas/test_calculadora.py pruebas/test_reporte.py
  integracion:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: pytest pruebas/test_integracion.py
    needs:
    - unitarias
  cobertura:
    name: Cobertura del proyecto
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: pytest --cov --cov-report=xml --junitxml=reports/junit.xml
    - name: Resumen de cobertura
      if: always()
      run: |
        echo '## Cobertura de todo el proyecto (líneas y ramas)' >> "$GITHUB_STEP_SUMMARY"
        coverage report >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: cobertura
        path: |-
          coverage.xml
          reports/junit.xml
        if-no-files-found: error
      if: always()
    needs:
    - unitarias
    - integracion
  secretos:
    name: Contraseñas y secretos (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
    - run: |
        mkdir -p reports
        docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --report-format json --report-path /repo/reports/gitleaks.json
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: secret-scan
        path: reports/gitleaks.json
      if: always()
  seguridad:
    name: Seguridad estática (Bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: mkdir -p reports && bandit -r calculadora.py api.py herramientas -f json -o reports/bandit.json
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: static-security
        path: reports/bandit.json
      if: always()
  dependencias:
    name: Vulnerabilidades de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - run: mkdir -p reports && pip-audit -r requirements.txt --format json --output reports/dependencies.json
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: dependency-audit
        path: reports/dependencies.json
      if: always()
  obsoletas:
    name: Dependencias obsoletas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - name: Reportar versiones nuevas (informativo)
      run: |
        mkdir -p reports
        pip list --outdated --format=json > reports/obsoletas.json
        python - <<'PYTHON'
        import json
        import os
        from pathlib import Path
        paquetes = json.loads(Path('reports/obsoletas.json').read_text())
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as resumen:
            resumen.write('## Dependencias obsoletas (informativo)\n\n')
            for paquete in paquetes:
                resumen.write(f"- {paquete['name']}: {paquete['version']} -> {paquete['latest_version']}\n")
            if not paquetes:
                resumen.write('Sin dependencias obsoletas.\n')
        PYTHON
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: outdated-dependencies
        path: reports/obsoletas.json
  zap:
    name: OWASP ZAP (API local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - name: Iniciar únicamente la API temporal
      run: |
        uvicorn api:aplicacion --host 0.0.0.0 --port 8000 --no-server-header > /tmp/api.log 2>&1 &
        for intento in {1..20}; do
          if curl -fsS http://127.0.0.1:8000/estado; then break; fi
          sleep 1
        done
        curl -fsS http://127.0.0.1:8000/openapi.json
    - uses: zaproxy/action-api-scan@bd24b11e76da11ab60302c8ae87f091cbb11f034
      with:
        target: http://127.0.0.1:8000/openapi.json
        format: openapi
        allow_issue_writing: false
        fail_action: true
        artifact_name: owasp-zap
    needs:
    - integracion
    - secretos
    - seguridad
    - dependencias
  sonarqube:
    name: Análisis SonarQube con cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        fetch-depth: 0
    - name: Validar acceso y configuración
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        if [ -z "$SONAR_TOKEN" ]; then
          echo '::error::Configura el secreto SONAR_TOKEN antes de ejecutar SonarQube.'
          exit 1
        fi
        curl --fail --silent --show-error --retry 3 "$SONAR_HOST_URL/api/system/status"
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: cobertura
        path: .
    - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: tarea-sonarqube
        path: .scannerwork/report-task.txt
        include-hidden-files: true
      if: always()
    needs:
    - cobertura
    - revision
    - secretos
    - seguridad
    - dependencias
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
  reporte:
    name: Descargar reporte SonarQube (PDF) y verificar Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: '3.12'
        cache: pip
    - run: pip install -r requirements.txt
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
      with:
        name: tarea-sonarqube
        path: .scannerwork
    - name: Exportar análisis real y evaluar Quality Gate
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: python -m herramientas.reporte_sonarqube
    - name: Generar la guía para compartir en clase
      run: python -m herramientas.guia_pdf
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: guia-para-alumnos-pdf
        path: material/GUIA_ALUMNOS.pdf
        if-no-files-found: error
        retention-days: 30
    - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
      with:
        name: sonarqube-report-pdf-json-md
        path: reports/sonarqube/
        if-no-files-found: error
        retention-days: 30
      if: always()
    needs:
    - sonarqube
  resumen:
    name: Resumen final y estado del pipeline
    if: always()
    needs:
    - revision
    - unitarias
    - integracion
    - cobertura
    - secretos
    - seguridad
    - dependencias
    - obsoletas
    - zap
    - sonarqube
    - reporte
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Estado de todos los controles
      env:
        RESULTADOS: ${{ toJSON(needs) }}
        ANALIZAR_SONAR: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: |
        python - <<'PYTHON'
        import json
        import os
        resultados = json.loads(os.environ['RESULTADOS'])
        fallos = []
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as resumen:
            resumen.write('# Resumen de la ejecución\n\n| Job | Resultado |\n|---|---|\n')
            for nombre, datos in resultados.items():
                estado = datos['result']
                resumen.write(f'| {nombre} | {estado} |\n')
                if estado == 'success':
                    continue
                if nombre in ('sonarqube', 'reporte') and estado == 'skipped' and os.environ['ANALIZAR_SONAR'] != 'true':
                    continue
                fallos.append(nombre)
            resumen.write('\nEl PDF separa cobertura e issues de todo el proyecto y del código nuevo.\n')
            resumen.write('\nSonarQube analiza main; en los PR se ejecutan los demás controles.\n')
        if fallos:
            raise SystemExit('Hay controles pendientes o fallidos: ' + ', '.join(fallos))
        PYTHON
